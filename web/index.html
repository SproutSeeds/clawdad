<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050204">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Clawdad">
    <meta property="og:title" content="Clawdad">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/assets/clawdad-mascot-app.png?v=20260406h">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="/assets/clawdad-mascot-app.png?v=20260406h">
    <title>Clawdad</title>
    <link rel="manifest" href="/manifest.webmanifest?v=20260414d">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/clawdad-apple-touch-icon.png?v=20260414d">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/clawdad-app-icon-192.png?v=20260414d">
    <script>
      window.__CLAWDAD_APP_BUILD__ = "__CLAWDAD_APP_BUILD_VALUE__";
    </script>
    <link rel="stylesheet" href="/app.css?v=__CLAWDAD_ASSET_VERSION__">
  </head>
  <body>
    <main class="app-shell">
      <header class="wordmark-wrap" aria-hidden="true">
        <div class="wordmark-lockup">
          <div class="wordmark">
            <span class="wordmark-line wordmark-line-top" data-text="Claw">Claw</span>
            <span class="wordmark-line wordmark-line-bottom" data-text="Dad">Dad</span>
          </div>
          <button
            id="headerCarouselButton"
            class="mascot-carousel"
            type="button"
            aria-label="Next mascot photo"
          >
            <img
              id="headerCarouselImage"
              class="mascot-photo"
              src="/assets/clawdad-header-01.jpg?v=20260406m"
              loading="eager"
              fetchpriority="high"
              decoding="async"
              alt=""
            >
          </button>
        </div>
        <p id="headerCatchphrase" class="header-catchphrase">"Pass dat clawdad glow, cher"</p>
      </header>

      <form id="dispatchForm" class="composer">
        <div class="workspace-tabs" aria-label="Clawdad workspace navigation">
          <button
            id="projectWorkspaceTab"
            class="workspace-tab is-active"
            type="button"
            aria-pressed="true"
            aria-controls="projectWorkspacePane"
          >
            Project
          </button>
          <button
            id="autoWorkspaceTab"
            class="workspace-tab"
            type="button"
            aria-pressed="false"
            aria-controls="autoWorkspacePane"
          >
            Delegation
            <span id="activeRunsOrb" class="control-orb" hidden aria-hidden="true"></span>
          </button>
        </div>

        <div id="projectWorkspacePane" class="workspace-pane" role="tabpanel" aria-labelledby="projectWorkspaceTab">
          <div class="project-subtabs" aria-label="Project views">
            <button class="project-subtab is-active" type="button" aria-pressed="true">Message</button>
            <button id="projectSummaryButton" class="project-subtab" type="button" aria-label="Open selected project summary" disabled>
              Summary
            </button>
            <button id="projectCodexButton" class="project-subtab" type="button" aria-label="Open selected project Codex integration" disabled>
              Codex
            </button>
          </div>

          <label class="sr-only" for="projectSelect">Project</label>
          <label class="sr-only" for="sessionSelect">Session</label>
          <div class="controls">
            <div class="project-control">
              <select id="projectSelect" name="project" disabled>
                <option value="">Loading projects…</option>
              </select>
              <button
                id="projectAddButton"
                class="thread-button"
                type="button"
                aria-label="Add project"
              >
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M8 3.25v9.5M3.25 8h9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
                </svg>
              </button>
              <button
                id="projectDelegateButton"
                class="thread-button delegate-open-button"
                type="button"
                aria-label="Open Auto-Claw for selected project"
                disabled
              >
                <span class="delegate-auto-glyph" aria-hidden="true">&infin;</span>
                <span class="button-text">Auto-Claw</span>
              </button>
            </div>
            <div class="session-control">
              <select id="sessionSelect" name="session" disabled>
                <option value="">Loading sessions…</option>
              </select>
              <button
                id="sessionRenameButton"
                class="thread-button"
                type="button"
                aria-label="Rename session"
              >
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M10.95 3.05 12.95 5.05M3.75 12.25l2.55-.45 5.8-5.8a1.41 1.41 0 0 0-2-2l-5.8 5.8-.45 2.45Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </button>
              <button
                id="sessionThreadButton"
                class="thread-button"
                type="button"
                aria-label="Open session thread"
              >
                <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
                  <path d="M4.25 5.35c0-1.44 1.18-2.6 2.63-2.6h4.24c1.45 0 2.63 1.16 2.63 2.6v3.3c0 1.44-1.18 2.6-2.63 2.6H8.3l-3.55 2.58.44-2.58H6.88c-1.45 0-2.63-1.16-2.63-2.6z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"></path>
                </svg>
              </button>
            </div>
          </div>

          <label class="sr-only" for="messageInput">Message</label>
          <textarea id="messageInput" name="message" rows="6" placeholder="Message"></textarea>
            <input
              id="composerAttachmentInput"
              type="file"
              name="attachments"
              accept="image/*,.heic,.heif,.png,.jpg,.jpeg,.gif,.webp,application/pdf,text/plain,text/markdown,.md,.txt,.json,.csv"
              multiple
              hidden
            >
            <input
              id="composerVoiceCaptureInput"
              type="file"
              accept="audio/*"
              capture
              hidden
            >
            <div id="composerAttachmentList" class="composer-attachment-list" hidden aria-live="polite"></div>

          <div class="composer-actions">
            <button
              id="composerToolsButton"
              class="thread-button composer-tools-button"
              type="button"
              aria-label="Open composer tools"
              aria-controls="composerToolsMenu"
              aria-expanded="false"
              aria-haspopup="true"
            >
              <img class="composer-tools-claw" src="/assets/clawdad-claw-hyperreal-icon.png" alt="" aria-hidden="true">
            </button>
            <section id="composerToolsMenu" class="composer-tools-menu" aria-label="Composer tools" hidden>
              <div class="composer-tools-list">
                <button
                  id="quickPromptButton"
                  class="composer-tools-item quick-prompt-open-button"
                  type="button"
                  aria-label="Open quick prompts"
                  aria-controls="quickPromptModal"
                  aria-expanded="false"
                  aria-haspopup="true"
                >
                  <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
                    <path d="M4.25 5.35c0-1.44 1.18-2.6 2.63-2.6h4.24c1.45 0 2.63 1.16 2.63 2.6v2.9c0 1.44-1.18 2.6-2.63 2.6H8.35l-3.6 2.4.5-2.4h-1c-1.45 0-2.63-1.16-2.63-2.6z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"></path>
                    <path d="M9 5.8v3.3M7.35 7.45h3.3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"></path>
                  </svg>
                  <span class="button-text">Quick chat</span>
                </button>
                <button
                  id="composerAttachmentButton"
                  class="composer-tools-item composer-attachment-button"
                  type="button"
                  aria-label="Attach files"
                >
                  <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
                    <path d="M6.05 9.25 10.7 4.6a2.45 2.45 0 0 1 3.46 3.46l-5.3 5.3a3.65 3.65 0 0 1-5.16-5.16l5.15-5.15" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M7.05 10.24 11.72 5.58a1.04 1.04 0 0 1 1.47 1.47l-4.9 4.9a1.64 1.64 0 0 1-2.32-2.32l4.2-4.2" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                  <span class="button-text">Attach file</span>
                </button>
                <button
                  id="currentTerminalButton"
                  class="composer-tools-item composer-terminal-button open-terminal-button"
                  type="button"
                  aria-label="Open selected session in terminal"
                  disabled
                >
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <rect x="2.4" y="3.2" width="11.2" height="9.6" rx="1.8" stroke="currentColor" stroke-width="1.35"></rect>
                    <path d="m4.9 6.15 1.95 1.85-1.95 1.85M8.2 9.85h3.1" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                  <span class="button-text">Open terminal</span>
                </button>
              </div>
              <div class="composer-tools-mode-group" aria-label="Message mode">
                <div class="composer-tools-label">Message mode</div>
                <div class="composer-mode-options">
                  <button class="composer-mode-option" type="button" data-dispatch-mode="linear">
                    <span class="button-text">Linear</span>
                  </button>
                  <button class="composer-mode-option" type="button" data-dispatch-mode="queue">
                    <span class="button-text">Queue</span>
                  </button>
                  <button class="composer-mode-option" type="button" data-dispatch-mode="interject">
                    <span class="button-text">Interject</span>
                  </button>
                </div>
              </div>
            </section>
            <section
              id="quickPromptModal"
              class="quick-prompt-dropdown quick-prompt-panel"
              aria-labelledby="quickPromptTitle"
              hidden
            >
              <div class="detail-head quick-prompt-dropdown-head">
                <div class="detail-meta">
                  <div id="quickPromptTitle" class="detail-project">Quick Chats</div>
                  <div id="quickPromptSubtitle" class="detail-session">Reusable composer inserts</div>
                </div>
                <div class="detail-actions">
                  <button id="quickPromptResetButton" class="detail-action-button is-quiet" type="button">
                    <span class="button-text">Defaults</span>
                  </button>
                  <button id="quickPromptNewButton" class="detail-action-button" type="button">
                    <span class="button-text">New</span>
                  </button>
                  <button id="quickPromptClose" class="detail-close" type="button" aria-label="Close quick chats">×</button>
                </div>
              </div>

              <div id="quickPromptState" class="detail-history-state is-empty"></div>
              <div class="quick-prompt-body">
                <div id="quickPromptList" class="quick-prompt-list"></div>
                <div id="quickPromptForm" class="quick-prompt-form" hidden>
                  <label class="sr-only" for="quickPromptTitleInput">Prompt title</label>
                  <input id="quickPromptTitleInput" name="title" type="text" placeholder="Title" autocomplete="off" maxlength="80">
                  <label class="sr-only" for="quickPromptTextInput">Prompt text</label>
                  <textarea id="quickPromptTextInput" name="text" rows="7" placeholder="Prompt text"></textarea>
                  <div class="quick-prompt-form-actions">
                    <button id="quickPromptDeleteButton" class="detail-action-button is-quiet" type="button">
                      <span class="button-text">Delete</span>
                    </button>
                    <button id="quickPromptCancelButton" class="detail-action-button is-quiet" type="button">
                      <span class="button-text">Cancel</span>
                    </button>
                    <button id="quickPromptSaveButton" class="detail-action-button" type="button">
                      <span class="button-text">Save</span>
                    </button>
                  </div>
                </div>
              </div>
            </section>
            <button id="dispatchButton" type="submit">
              <span class="button-text">Send (Linear)</span>
            </button>
            <button
              id="composerVoiceButton"
              class="thread-button composer-voice-button"
              type="button"
              aria-label="Record voice message"
            >
              <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M9 2.65a2.15 2.15 0 0 0-2.15 2.15v3.6a2.15 2.15 0 0 0 4.3 0V4.8A2.15 2.15 0 0 0 9 2.65Z" stroke="currentColor" stroke-width="1.35"></path>
                <path d="M4.55 8.05a4.45 4.45 0 0 0 8.9 0M9 12.5v2.85M6.7 15.35h4.6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"></path>
              </svg>
            </button>
          </div>
        </div>

        <section id="autoWorkspacePane" class="workspace-pane auto-workspace" role="tabpanel" aria-labelledby="autoWorkspaceTab" hidden>
          <div class="delegation-dashboard-head">
            <div class="delegation-dashboard-title">Delegation Dashboard</div>
            <div id="activeRunsInlineMeta" class="active-runs-inline-meta"></div>
          </div>
          <div class="active-runs-inline-head">
            <span class="active-runs-inline-meta">Live Delegation Runs</span>
          </div>
          <div id="activeRunsInlineState" class="detail-history-state is-empty"></div>
          <div id="activeRunsInlineList" class="detail-history-list active-runs-list"></div>
          <div class="active-runs-inline-head">
            <span id="selectedProjectDelegateMeta" class="active-runs-inline-meta">Selected Project Lanes</span>
          </div>
          <div id="selectedProjectDelegateState" class="detail-history-state is-empty"></div>
          <div id="selectedProjectDelegateList" class="detail-history-list active-runs-list selected-delegate-list"></div>
        </section>

      </form>

      <section id="artifactShelf" class="artifact-shelf" hidden aria-live="polite">
        <div class="artifact-shelf-head">
          <div>
            <div id="artifactShelfTitle" class="artifact-shelf-title">Dumpy party</div>
            <div id="artifactShelfMeta" class="artifact-shelf-meta"></div>
          </div>
          <div class="artifact-shelf-actions">
            <button id="artifactShelfOpenButton" class="artifact-shelf-open" type="button">Open Dumpy</button>
            <button
              id="artifactShelfToggle"
              class="queue-toggle artifact-shelf-toggle"
              type="button"
              aria-expanded="true"
              aria-controls="artifactShelfBody"
              aria-label="Collapse files"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M3.5 6 8 10l4.5-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="artifactShelfBody" class="artifact-shelf-body">
          <div id="artifactShelfList" class="artifact-shelf-list"></div>
        </div>
      </section>

      <section class="queue" aria-live="polite">
        <div class="queue-headbar">
          <div class="queue-status">
            <div id="mailboxState" class="mailbox-state is-empty"></div>
            <span id="queueUnreadOrb" class="queue-unread-orb" hidden aria-hidden="true"></span>
          </div>
          <div class="queue-actions">
            <button
              id="audioAutoDownloadButton"
              class="queue-toggle audio-auto-download-button"
              type="button"
              aria-pressed="false"
              aria-label="Enable automatic audio downloads"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 3.2v5.6m0 0 2.5-2.5M8 8.8 5.5 6.3M3.4 11.8h9.2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
              <span class="button-text">Auto audio</span>
            </button>
            <button
              id="queueToggle"
              class="queue-toggle"
              type="button"
              aria-expanded="true"
              aria-controls="queueBody"
              aria-label="Collapse queue"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M3.5 6 8 10l4.5-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="queueBody" class="queue-body">
          <div id="queueList" class="queue-list"></div>
        </div>
      </section>
    </main>

    <div id="queueArchiveModal" class="detail-modal queue-archive-modal" hidden>
      <button id="queueArchiveBackdrop" class="detail-backdrop" type="button" aria-label="Cancel archive"></button>
      <section class="detail-panel queue-archive-panel" role="dialog" aria-modal="true" aria-labelledby="queueArchiveTitle">
        <div class="detail-head">
          <div class="detail-meta">
            <div id="queueArchiveTitle" class="detail-project">Archive card?</div>
            <div id="queueArchiveMeta" class="detail-session"></div>
          </div>
          <button id="queueArchiveClose" class="detail-close" type="button" aria-label="Cancel archive">×</button>
        </div>
        <div id="queueArchiveMessage" class="queue-archive-message"></div>
        <div class="queue-archive-actions">
          <button id="queueArchiveCancelButton" class="detail-action-button is-quiet" type="button">
            <span class="button-text">Keep</span>
          </button>
          <button id="queueArchiveConfirmButton" class="detail-action-button" type="button">
            <span class="button-text">Archive</span>
          </button>
        </div>
      </section>
    </div>

    <div id="detailModal" class="detail-modal" hidden>
      <button id="detailBackdrop" class="detail-backdrop" type="button" aria-label="Close"></button>
      <section class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailProject">
        <div class="detail-head">
          <div class="detail-meta">
            <div id="detailProject" class="detail-project"></div>
            <div id="detailSession" class="detail-session"></div>
          </div>
          <button id="detailClose" class="detail-close" type="button" aria-label="Close">×</button>
        </div>

        <div id="detailHistoryState" class="detail-history-state is-empty"></div>
        <div id="detailHistoryList" class="detail-history-list"></div>
        <button
          id="detailScrollBottomButton"
          class="detail-scroll-bottom-button"
          type="button"
          aria-label="Jump to most recent message"
          hidden
        >
          <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 3.8v9.1m0 0 3.7-3.7M9 12.9 5.3 9.2" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </section>
    </div>

    <div id="artifactsModal" class="detail-modal" hidden>
      <button id="artifactsBackdrop" class="detail-backdrop" type="button" aria-label="Close"></button>
      <section class="detail-panel project-modal-panel" role="dialog" aria-modal="true" aria-labelledby="artifactsProject">
        <div class="detail-head">
          <div class="detail-meta">
            <div id="artifactsProject" class="detail-project"></div>
            <div id="artifactsRoot" class="detail-session"></div>
          </div>
          <div class="detail-actions">
            <button id="artifactsRefreshButton" class="detail-action-button" type="button">
              <span class="button-text">Refresh</span>
            </button>
            <button id="artifactsClose" class="detail-close" type="button" aria-label="Close">×</button>
          </div>
        </div>

        <div id="artifactsState" class="detail-history-state is-empty"></div>
        <div id="artifactsList" class="detail-history-list artifacts-list"></div>
      </section>
    </div>

    <div id="projectModal" class="detail-modal" hidden>
      <button id="projectModalBackdrop" class="detail-backdrop" type="button" aria-label="Close"></button>
      <section class="detail-panel project-modal-panel" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
        <div class="detail-head">
          <div class="detail-meta">
            <div id="projectModalTitle" class="detail-project">Add Project</div>
            <div id="projectModalState" class="detail-session is-empty"></div>
          </div>
          <button id="projectModalClose" class="detail-close" type="button" aria-label="Close">×</button>
        </div>

        <form id="projectModalForm" class="project-modal-form">
          <div class="project-mode-tabs" role="tablist" aria-label="Project mode">
            <button id="projectModeExisting" class="mode-chip" type="button" data-mode="existing">Existing</button>
            <button id="projectModeNew" class="mode-chip" type="button" data-mode="new">New</button>
          </div>

          <label class="sr-only" for="projectRootSelect">Root</label>
          <select id="projectRootSelect" name="root" disabled>
            <option value="">Loading roots…</option>
          </select>

          <label class="sr-only" for="projectRepoSelect">Repo</label>
          <select id="projectRepoSelect" name="repo" disabled>
            <option value="">Choose repo…</option>
          </select>

          <label class="sr-only" for="projectNameInput">Project name</label>
          <input id="projectNameInput" name="projectName" type="text" placeholder="new-project" autocomplete="off" hidden>

          <label class="sr-only" for="projectProviderSelect">Provider</label>
          <select id="projectProviderSelect" name="provider">
            <option value="codex">Codex</option>
            <option value="chimera">Chimera local</option>
          </select>

          <button id="projectCreateButton" type="submit">
            <span class="button-text">Add</span>
          </button>
        </form>
      </section>
    </div>

    <div id="sessionTitleModal" class="detail-modal" hidden>
      <button id="sessionTitleBackdrop" class="detail-backdrop" type="button" aria-label="Close"></button>
      <section class="detail-panel project-modal-panel" role="dialog" aria-modal="true" aria-labelledby="sessionTitleProject">
        <div class="detail-head">
          <div class="detail-meta">
            <div id="sessionTitleProject" class="detail-project"></div>
            <div id="sessionTitleSession" class="detail-session"></div>
          </div>
          <button id="sessionTitleClose" class="detail-close" type="button" aria-label="Close">×</button>
        </div>

        <form id="sessionTitleForm" class="session-title-form">
          <div id="sessionTitleState" class="detail-history-state is-empty"></div>
          <label class="sr-only" for="sessionTitleInput">Session title</label>
          <input id="sessionTitleInput" name="sessionTitle" type="text" placeholder="Thread title" autocomplete="off" maxlength="80">
          <div class="session-title-actions">
            <button id="sessionTitleRemoveButton" class="detail-action-button is-quiet" type="button">
              <span class="button-text">Remove session</span>
            </button>
            <button id="sessionTitleSaveButton" class="detail-action-button" type="submit">
              <span class="button-text">Save</span>
            </button>
          </div>
        </form>
      </section>
    </div>

    <div id="sessionImportModal" class="detail-modal" hidden>
      <button id="sessionImportBackdrop" class="detail-backdrop" type="button" aria-label="Close"></button>
      <section class="detail-panel project-modal-panel" role="dialog" aria-modal="true" aria-labelledby="sessionImportProject">
        <div class="detail-head">
          <div class="detail-meta">
            <div id="sessionImportProject" class="detail-project"></div>
            <div id="sessionImportState" class="detail-session"></div>
          </div>
          <button id="sessionImportClose" class="detail-close" type="button" aria-label="Close">×</button>
        </div>

        <div id="sessionImportList" class="detail-history-list import-session-list"></div>
      </section>
    </div>

    <div id="summaryModal" class="detail-modal" hidden>
      <button id="summaryBackdrop" class="detail-backdrop" type="button" aria-label="Close"></button>
      <section class="detail-panel project-modal-panel" role="dialog" aria-modal="true" aria-labelledby="summaryProject">
        <div class="detail-head">
          <div class="detail-meta">
            <div id="summaryProject" class="detail-project"></div>
            <div id="summarySession" class="detail-session"></div>
          </div>
          <div class="detail-actions">
            <button id="summaryRefreshButton" class="detail-action-button" type="button">
              <span class="button-text">New summary</span>
            </button>
            <button id="summaryClose" class="detail-close" type="button" aria-label="Close">×</button>
          </div>
        </div>

        <div id="summaryState" class="detail-history-state is-empty"></div>
        <div id="summaryList" class="detail-history-list summary-list"></div>
      </section>
    </div>

    <div id="codexIntegrationModal" class="detail-modal" hidden>
      <button id="codexIntegrationBackdrop" class="detail-backdrop" type="button" aria-label="Close"></button>
      <section class="detail-panel project-modal-panel" role="dialog" aria-modal="true" aria-labelledby="codexIntegrationProject">
        <div class="detail-head">
          <div class="detail-meta">
            <div id="codexIntegrationProject" class="detail-project"></div>
            <div id="codexIntegrationStatus" class="detail-session"></div>
          </div>
          <div class="detail-actions">
            <button id="codexIntegrationRefreshButton" class="detail-action-button is-quiet" type="button">
              <span class="button-text">Check</span>
            </button>
            <button id="codexIntegrationInstallButton" class="detail-action-button" type="button">
              <span class="button-text">Install</span>
            </button>
            <button id="codexIntegrationClose" class="detail-close" type="button" aria-label="Close">×</button>
          </div>
        </div>

        <div id="codexIntegrationState" class="detail-history-state is-empty"></div>
        <div id="codexIntegrationList" class="detail-history-list codex-integration-list"></div>
      </section>
    </div>

    <div id="activeRunsModal" class="detail-modal" hidden>
      <button id="activeRunsBackdrop" class="detail-backdrop" type="button" aria-label="Close"></button>

        <div class="detail-head">
          <div class="detail-meta">
            <div id="activeRunsTitle" class="detail-project">Delegation Dashboard</div>
            <div id="activeRunsMeta" class="detail-session"></div>
          </div>
          <button id="activeRunsClose" class="detail-close" type="button" aria-label="Close">×</button>
        </div>

        <div id="activeRunsState" class="detail-history-state is-empty"></div>
        <div id="activeRunsList" class="detail-history-list active-runs-list"></div>
      </section>
    </div>

    <div id="delegateModal" class="detail-modal" hidden>
      <button id="delegateBackdrop" class="detail-backdrop" type="button" aria-label="Close"></button>
      <section class="detail-panel project-modal-panel" role="dialog" aria-modal="true" aria-labelledby="delegateProject">
        <div class="detail-head">
          <div class="detail-meta">
            <div id="delegateProject" class="detail-project"></div>
            <div id="delegateSession" class="detail-session" hidden></div>
          </div>
          <div class="detail-actions">
            <button id="delegateSaveButton" class="detail-action-button" type="button">
              <span class="button-text">Save</span>
            </button>
            <button id="delegateRunButton" class="detail-action-button delegate-auto-button" type="button" aria-label="Start or pause Auto-Claw delegation">
              <span class="auto-icon" aria-hidden="true">&infin;</span>
              <span class="button-text">Auto-Claw</span>
            </button>
            <button id="delegateClose" class="detail-close" type="button" aria-label="Close">×</button>
          </div>
        </div>

        <div id="delegateState" class="detail-history-state is-empty"></div>
        <div id="delegateOverview" class="delegate-overview"></div>

        <div class="delegate-carousel" aria-label="Delegate views">
          <div id="delegateCarouselTabs" class="delegate-carousel-tabs" role="tablist" aria-label="Delegate views"></div>

          <section id="delegateProgressPanel" class="delegate-slide" data-delegate-slide="progress">
            <div id="delegateProgressList" class="delegate-progress-list"></div>
          </section>

          <section id="delegateRunsPanel" class="delegate-slide" data-delegate-slide="history" hidden>
            <div id="delegateRunCardList" class="delegate-run-card-list"></div>
          </section>

          <section id="delegateRunLogPanel" class="delegate-slide" data-delegate-slide="details" hidden>
            <div class="delegate-details-list">
              <details class="delegate-detail-section">
                <summary>Start checks</summary>
                <div id="delegateDiagnosticsChecks" class="delegate-detail-section-body"></div>
              </details>
              <details id="delegateSupervisorPanel" class="delegate-detail-section">
                <summary>Loop state</summary>
                <div id="delegateSupervisorList" class="delegate-supervisor-timeline delegate-detail-section-body"></div>
              </details>
              <details class="delegate-detail-section">
                <summary>IDs and goal sync</summary>
                <div id="delegateDebugList" class="delegate-debug-list delegate-detail-section-body"></div>
              </details>
              <details id="delegateReviewPanel" class="delegate-detail-section">
                <summary>Watchtower cards</summary>
                <div id="delegateReviewList" class="delegate-review-list delegate-detail-section-body"></div>
              </details>
              <details class="delegate-detail-section">
                <summary>Raw run log</summary>
                <div id="delegateRunList" class="detail-history-list delegate-run-list delegate-detail-section-body"></div>
              </details>
            </div>
          </section>

          <section id="delegateBriefPanel" class="delegate-slide" data-delegate-slide="brief" hidden>
            <textarea id="delegateBriefInput" class="delegate-brief-input" rows="14" placeholder="Goal, objective, gates…"></textarea>
          </section>
        </div>
      </section>
    </div>

    <script type="module" src="/app.js?v=__CLAWDAD_ASSET_VERSION__"></script>
  </body>
